name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Cleanup Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install OpenJDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Prepare Build Environment
        run: |
          sudo apt update && sudo apt upgrade -y
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq git python3 tar aria2 openssl unzip
          
          git clone https://gitlab.com/OrangeFox/misc/scripts ofox_scripts
          cd ofox_scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh
          
          git config --global user.name "sysmar3x-glitch"
          git config --global user.email "sysmar3x-glitch@users.noreply.github.com"

      - name: Initialize Workspace & Sync
        run: |
          mkdir workspace
          cd workspace
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          yes | ./orangefox_sync.sh --branch 12.1 --path $GITHUB_WORKSPACE/workspace

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/infinix/X682C
          fetch-depth: 1

      - name: Build Recovery
        run: |
          cd workspace
          
          # 1. Patch relink.sh to prevent strict exit code 1 crashes
          sed -i 's/set -e/set +e/g' bootable/recovery/prebuilt/relink.sh || true
          sed -i 's/exit 1/exit 0/g' bootable/recovery/prebuilt/relink.sh || true
          
          # 2. Generate a valid RSA 4096 key to prevent the AVB signing crash
          mkdir -p build/make/target/product/security
          openssl genrsa -out build/make/target/product/security/testkey.pem 4096
          
          # 3. Create an rsync wrapper to globally ignore the vendor symlink crash
          mkdir -p $GITHUB_WORKSPACE/bin
          cat << 'EOF' > $GITHUB_WORKSPACE/bin/rsync
          #!/bin/bash
          exec /usr/bin/rsync "$@" --exclude=vendor --exclude=vendor/*
          EOF
          chmod +x $GITHUB_WORKSPACE/bin/rsync
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"

          # 4. Automatically find, extract, and inject ramdisk.zip
          echo "Scanning for ramdisk.zip..."
          RAMDISK_ZIP=$(find "$GITHUB_WORKSPACE" -name "ramdisk.zip" | head -n 1)
          if [ -n "$RAMDISK_ZIP" ]; then
            echo "Found ramdisk archive at: $RAMDISK_ZIP"
            mkdir -p /tmp/twrp_extract
            unzip -qo "$RAMDISK_ZIP" -d /tmp/twrp_extract
            
            # Determine directory structure inside zip
            if [ -d "/tmp/twrp_extract/ramdisk" ]; then
              SRC_RD="/tmp/twrp_extract/ramdisk"
            else
              SRC_RD="/tmp/twrp_extract"
            fi
            
            DEST_ROOT="device/infinix/X682C/recovery/root"
            mkdir -p "$DEST_ROOT"
            
            # Inject System Blobs (Decryption libraries and binaries)
            if [ -d "$SRC_RD/system" ]; then
              echo "Injecting system libraries..."
              cp -rf "$SRC_RD/system" "$DEST_ROOT/"
            fi
            
            # Inject Vendor Firmware (Touch screen firmware & configs)
            if [ -d "$SRC_RD/vendor" ]; then
              echo "Injecting vendor firmware..."
              mkdir -p "$DEST_ROOT/vendor"
              cp -rf "$SRC_RD/vendor/"* "$DEST_ROOT/vendor/" 2>/dev/null || true
              
              mkdir -p "$DEST_ROOT/system/vendor"
              cp -rf "$SRC_RD/vendor/"* "$DEST_ROOT/system/vendor/" 2>/dev/null || true
              
              if [ -d "$SRC_RD/vendor/firmware" ]; then
                mkdir -p "$DEST_ROOT/etc/firmware"
                cp -rf "$SRC_RD/vendor/firmware/"* "$DEST_ROOT/etc/firmware/" 2>/dev/null || true
              fi
            fi
            
            # Inject init service scripts and configs
            cp -f "$SRC_RD"/*.rc "$DEST_ROOT/" 2>/dev/null || true
            [ -f "$SRC_RD/ueventd.rc" ] && cp -f "$SRC_RD/ueventd.rc" "$DEST_ROOT/" || true
            [ -f "$SRC_RD/prop.default" ] && cp -f "$SRC_RD/prop.default" "$DEST_ROOT/" || true
            
            echo "Ramdisk injection complete!"
          else
            echo "WARNING: ramdisk.zip not found! Ensure it is committed to your repository."
          fi

          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=X682C
          export LC_ALL="C"
          
          lunch twrp_X682C-eng
          
          set -e -o pipefail
          mka adbd recoveryimage 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: workspace/build.log

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X682C-Recovery
          path: workspace/out/target/product/X682C/recovery.img
