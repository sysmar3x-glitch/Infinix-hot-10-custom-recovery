name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check Out Device Tree
        uses: actions/checkout@v4

      - name: Cleanup Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install OpenJDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Prepare Build Environment
        run: |
          sudo apt update && sudo apt upgrade -y
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq git python3 tar aria2 openssl unzip pigz gzip
          
          git clone https://gitlab.com/OrangeFox/misc/scripts ofox_scripts
          cd ofox_scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh
          
          git config --global user.name "sysmar3x-glitch"
          git config --global user.email "sysmar3x-glitch@users.noreply.github.com"

      - name: Initialize Workspace & Sync Source
        run: |
          mkdir workspace
          cd workspace
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          yes | ./orangefox_sync.sh --branch 12.1 --path $GITHUB_WORKSPACE/workspace

      - name: Checkout Device Tree to Target Path
        uses: actions/checkout@v4
        with:
          path: workspace/device/infinix/X682C
          fetch-depth: 1

      - name: Build Recovery Image
        run: |
          cd workspace
          
          # 1. Patch relink.sh to prevent build failures on prebuilts
          sed -i 's/set -e/set +e/g' bootable/recovery/prebuilt/relink.sh || true
          sed -i 's/exit 1/exit 0/g' bootable/recovery/prebuilt/relink.sh || true
          
          # 2. Generate RSA 4096 key for AVB signing
          mkdir -p build/make/target/product/security
          openssl genrsa -out build/make/target/product/security/testkey.pem 4096

          # 3. Create rsync wrapper to prevent out/.../root/vendor symlink from crashing against out/.../recovery/root/vendor directory
          mkdir -p "$GITHUB_WORKSPACE/bin"
          cat << 'EOF' > "$GITHUB_WORKSPACE/bin/rsync"
          #!/bin/bash
          exec /usr/bin/rsync "$@" --exclude=/root/vendor --exclude=vendor --exclude=vendor/*
          EOF
          chmod +x "$GITHUB_WORKSPACE/bin/rsync"
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"

          # 4. Define Ramdisk Destination Root
          TREE_DIR="$GITHUB_WORKSPACE/workspace/device/infinix/X682C"
          DEST_ROOT="$TREE_DIR/recovery/root"
          mkdir -p "$DEST_ROOT/system/etc"
          mkdir -p "$DEST_ROOT/etc"

          # CRITICAL: Never place prop.default or default.prop in $DEST_ROOT, or cp -rf at 99% will wipe out the generated Android/OrangeFox prop.default
          rm -f "$DEST_ROOT/prop.default" "$DEST_ROOT/default.prop"

          # 5. Copy Clean FSTAB and Flags
          cp -f "$TREE_DIR/recovery.fstab" "$DEST_ROOT/system/etc/recovery.fstab"
          cp -f "$TREE_DIR/recovery.fstab" "$DEST_ROOT/etc/recovery.fstab"
          cp -f "$TREE_DIR/twrp.flags" "$DEST_ROOT/system/etc/twrp.flags"
          cp -f "$TREE_DIR/twrp.flags" "$DEST_ROOT/etc/twrp.flags"

          # 6. Process and Inject vendor.zip Firmware (copied via cp -rf at 99%)
          echo "Scanning for vendor.zip..."
          VENDOR_ZIP=$(find "$GITHUB_WORKSPACE" -name "vendor.zip" | head -n 1)
          if [ -n "$VENDOR_ZIP" ]; then
            echo "Found vendor.zip at: $VENDOR_ZIP"
            mkdir -p /tmp/vendor_extract
            unzip -qo "$VENDOR_ZIP" -d /tmp/vendor_extract
            
            mkdir -p "$DEST_ROOT/vendor/firmware"
            mkdir -p "$DEST_ROOT/system/vendor/firmware"
            mkdir -p "$DEST_ROOT/etc/firmware"
            
            if [ -d "/tmp/vendor_extract/vendor/firmware" ]; then
              cp -rf /tmp/vendor_extract/vendor/firmware/* "$DEST_ROOT/vendor/firmware/" || true
              cp -rf /tmp/vendor_extract/vendor/firmware/* "$DEST_ROOT/system/vendor/firmware/" || true
              cp -rf /tmp/vendor_extract/vendor/firmware/* "$DEST_ROOT/etc/firmware/" || true
            elif [ -d "/tmp/vendor_extract/firmware" ]; then
              cp -rf /tmp/vendor_extract/firmware/* "$DEST_ROOT/vendor/firmware/" || true
              cp -rf /tmp/vendor_extract/firmware/* "$DEST_ROOT/system/vendor/firmware/" || true
              cp -rf /tmp/vendor_extract/firmware/* "$DEST_ROOT/etc/firmware/" || true
            fi

            if [ -d "/tmp/vendor_extract/vendor/lib/modules" ]; then
              mkdir -p "$DEST_ROOT/vendor/lib/modules"
              cp -rf /tmp/vendor_extract/vendor/lib/modules/* "$DEST_ROOT/vendor/lib/modules/" || true
            elif [ -d "/tmp/vendor_extract/lib/modules" ]; then
              mkdir -p "$DEST_ROOT/vendor/lib/modules"
              cp -rf /tmp/vendor_extract/lib/modules/* "$DEST_ROOT/vendor/lib/modules/" || true
            fi
            echo "Vendor firmware successfully integrated."
          fi

          # 7. Inject Init Scripts and Create Valid Unix Symlink for charger
          echo "Setting up init scripts and true charger symlink..."
          cp -f "$TREE_DIR/init.recovery.usb.rc" "$DEST_ROOT/init.recovery.usb.rc"
          cp -f "$TREE_DIR/init.recovery.mt6768.rc" "$DEST_ROOT/init.recovery.mt6768.rc"
          chmod 750 "$DEST_ROOT/init.recovery.usb.rc"
          chmod 750 "$DEST_ROOT/init.recovery.mt6768.rc"
          
          rm -f "$TREE_DIR/charger" "$DEST_ROOT/charger"
          ln -sf /system/bin/charger "$DEST_ROOT/charger"

          # 8. Environment Setup & Build Execution
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=X682C
          export LC_ALL="C"
          
          lunch twrp_X682C-eng
          
          set -e -o pipefail
          mka adbd recoveryimage 2>&1 | tee build.log

          # 9. Post-Build Image Size Verification (Must be <= 33554432 bytes per SYS15)
          REC_IMG="out/target/product/X682C/recovery.img"
          if [ -f "$REC_IMG" ]; then
            IMG_SIZE=$(stat -c%s "$REC_IMG")
            echo "Built recovery.img size: $IMG_SIZE / 33554432 bytes"
            if [ "$IMG_SIZE" -gt 33554432 ]; then
              echo "ERROR: recovery.img exceeds 32MB partition boundary!"
              exit 1
            fi
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: workspace/build.log

      - name: Upload Recovery Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X682C-Recovery
          path: workspace/out/target/product/X682C/recovery.img
