name: Build OrangeFox Recovery

on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    name: Compile Recovery
    runs-on: ubuntu-22.04

    steps:
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 rsync bc cpio libssl-dev lzop schedtool
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          git config --global user.name "sysmar3x-glitch"
          git config --global user.email "sysmar3x-glitch@users.noreply.github.com"

      - name: Sync OrangeFox Workspace
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          yes | ./orangefox_sync.sh --branch 12.1 --path ${{ github.workspace }}/workspace

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/infinix/X682C

      - name: Build Recovery
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=X682C
          export LC_ALL="C"
          lunch twrp_X682C-eng
          mka recoveryimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X682C-Recovery
          path: workspace/out/target/product/X682C/recovery.img
