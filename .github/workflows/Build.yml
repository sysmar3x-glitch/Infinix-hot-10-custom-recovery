name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check Out Device Tree
        uses: actions/checkout@v4

      - name: Cleanup Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install OpenJDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Prepare Build Environment
        run: |
          sudo apt update && sudo apt upgrade -y
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq git python3 tar aria2 openssl unzip
          
          git clone https://gitlab.com/OrangeFox/misc/scripts ofox_scripts
          cd ofox_scripts
          sudo bash setup/android_build_env.sh
          sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
          sudo bash setup/install_android_sdk.sh
          
          git config --global user.name "sysmar3x-glitch"
          git config --global user.email "sysmar3x-glitch@users.noreply.github.com"

      - name: Initialize Workspace & Sync Source
        run: |
          mkdir workspace
          cd workspace
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          yes | ./orangefox_sync.sh --branch 12.1 --path $GITHUB_WORKSPACE/workspace

      - name: Checkout Device Tree to Target Path
        uses: actions/checkout@v4
        with:
          path: workspace/device/infinix/X682C
          fetch-depth: 1

      - name: Build Recovery Image
        run: |
          cd workspace
          
          # 1. Patch relink.sh to prevent build failures
          sed -i 's/set -e/set +e/g' bootable/recovery/prebuilt/relink.sh || true
          sed -i 's/exit 1/exit 0/g' bootable/recovery/prebuilt/relink.sh || true
          
          # 2. Generate RSA 4096 key for AVB signing
          mkdir -p build/make/target/product/security
          openssl genrsa -out build/make/target/product/security/testkey.pem 4096
          
          # 3. Create an rsync wrapper to globally ignore the vendor symlink crash
          mkdir -p $GITHUB_WORKSPACE/bin
          cat << 'EOF' > $GITHUB_WORKSPACE/bin/rsync
          #!/bin/bash
          exec /usr/bin/rsync "$@" --exclude=vendor --exclude=vendor/*
          EOF
          chmod +x $GITHUB_WORKSPACE/bin/rsync
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"

          # 4. Define Ramdisk Destination Root
          DEST_ROOT="$GITHUB_WORKSPACE/workspace/device/infinix/X682C/recovery/root"
          mkdir -p "$DEST_ROOT"

          # 5. Process and Inject vendor.zip (Keymaster, Gatekeeper & Firmwares)
          echo "Scanning for vendor.zip..."
          VENDOR_ZIP=$(find "$GITHUB_WORKSPACE" -name "vendor.zip" | head -n 1)
          if [ -n "$VENDOR_ZIP" ]; then
            echo "Found vendor.zip at: $VENDOR_ZIP"
            mkdir -p /tmp/vendor_extract
            unzip -qo "$VENDOR_ZIP" -d /tmp/vendor_extract
            
            mkdir -p "$DEST_ROOT/vendor"
            if [ -d "/tmp/vendor_extract/vendor" ]; then
              cp -rf /tmp/vendor_extract/vendor/* "$DEST_ROOT/vendor/"
            else
              cp -rf /tmp/vendor_extract/* "$DEST_ROOT/vendor/"
            fi

            # Firmware Paths
            if [ -d "$DEST_ROOT/vendor/firmware" ]; then
              mkdir -p "$DEST_ROOT/etc/firmware"
              mkdir -p "$DEST_ROOT/system/etc/firmware"
              cp -rf "$DEST_ROOT/vendor/firmware/"* "$DEST_ROOT/etc/firmware/" || true
              cp -rf "$DEST_ROOT/vendor/firmware/"* "$DEST_ROOT/system/etc/firmware/" || true
            fi

            # Set Execution Permissions for Binary Services
            if [ -d "$DEST_ROOT/vendor/bin" ]; then
              chmod -R 755 "$DEST_ROOT/vendor/bin/" || true
            fi

            echo "Vendor binaries and decryption services successfully integrated!"
          else
            echo "Warning: vendor.zip not found in workspace root."
          fi

          # 6. Inject Init Scripts and Charger
          echo "Injecting custom init scripts..."
          cp "$GITHUB_WORKSPACE/workspace/device/infinix/X682C/init.recovery.usb.rc" "$DEST_ROOT/" || true
          cp "$GITHUB_WORKSPACE/workspace/device/infinix/X682C/init.recovery.mt6768.rc" "$DEST_ROOT/" || true
          cp "$GITHUB_WORKSPACE/workspace/device/infinix/X682C/charger" "$DEST_ROOT/" || true
          chmod 750 "$DEST_ROOT/init.recovery.usb.rc" || true
          chmod 750 "$DEST_ROOT/init.recovery.mt6768.rc" || true
          chmod 750 "$DEST_ROOT/charger" || true

          # 7. Default Properties and ADB Debug Overrides
          echo "ro.debuggable=1" >> "$DEST_ROOT/prop.default"
          echo "ro.adb.secure=0" >> "$DEST_ROOT/prop.default"
          echo "sys.usb.config=mtp,adb" >> "$DEST_ROOT/prop.default"
          echo "ro.hardware=mt6768" >> "$DEST_ROOT/prop.default"
          
          # 8. Environment Setup & Build Execution
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=X682C
          export LC_ALL="C"
          
          lunch twrp_X682C-eng
          
          set -e -o pipefail
          mka adbd recoveryimage 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: workspace/build.log

      - name: Upload Recovery Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X682C-Recovery
          path: workspace/out/target/product/X682C/recovery.img
