name: Build OrangeFox Recovery

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Recovery
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Maximize Build Space & Add Emergency Swap
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          
          # Create an additional 16GB swap file without touching the default busy swap
          sudo fallocate -l 16G /swapfile_extra
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          df -h
          free -h

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 x11proto-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 openjdk-11-jdk rsync bc cpio libssl-dev lzop schedtool ccache
          sudo curl -o /usr/local/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "sysmar3x-glitch"
          git config --global user.email "sysmar3x-glitch@users.noreply.github.com"

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Sync OrangeFox Workspace
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git
          cd sync
          yes | ./orangefox_sync.sh --branch 12.1 --path ${{ github.workspace }}/workspace

      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: workspace/device/infinix/X682C
          fetch-depth: 1

      - name: Build Recovery
        run: |
          cd workspace
          
          # Symlink trick to bypass Android's read-only cache limits
          mkdir -p out/ccache
          mkdir -p ~/.cache
          ln -s $(pwd)/out/ccache ~/.cache/ccache
          
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 10G
          ccache -o compression=true
          
          set +e
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=X682C
          export LC_ALL="C"
          
          # Strict Java limit
          export _JAVA_OPTIONS="-Xmx2g"
          
          # Explicitly force Ninja to 2 threads so it doesn't ignore Make's limits
          export SOONG_GEN_NINJA_ARGS="-j2"
          export NINJA_ARGS="-j2"
          
          lunch twrp_X682C-eng
          
          set -e
          make -j2 recoveryimage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-X682C-Recovery
          path: workspace/out/target/product/X682C/recovery.img
